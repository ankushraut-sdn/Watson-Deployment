      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#94a3b8" flood-opacity="0.25"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .subtitle { font: 600 18px 'Segoe UI', Arial, sans-serif; fill:#334155; }
      .body { font: 500 16px 'Segoe UI', Arial, sans-serif; fill:#1e293b; }
      .small { font: 500 13px 'Segoe UI', Arial, sans-serif; fill:#334155; }
      .tiny { font: 500 12px 'Segoe UI', Arial, sans-serif; fill:#475569; }
      .sectionTitle { font: 700 18px 'Segoe UI', Arial, sans-serif; fill:white; }
      .panelTitle { font: 700 16px 'Segoe UI', Arial, sans-serif; fill:#0f172a; }
      .panelSub { font: 600 13px 'Segoe UI', Arial, sans-serif; fill:#475569; }
