<rect x="18" y="18" width="1564" height="944" rx="24" fill="white" stroke="#1e3a8a" stroke-width="4" filter="url(#shadow)"/><text x="800" y="64" text-anchor="middle" class="title">Multi-Cloud Deployment Architecture for Reusable ML Models</text><text x="800" y="98" text-anchor="middle" class="subtitle">One reusable model package. Four cloud platforms. Consistent inference patterns.</text><text x="800" y="124" text-anchor="middle" class="small">Designed to support multiple interchangeable models — Benefits is only one example.</text><rect x="44" y="160" width="300" height="250" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2.5"/><rect x="68" y="146" width="252" height="40" rx="20.0" fill="#1d4ed8"/><text x="194.0" y="172.0" text-anchor="middle" class="sectionTitle">INPUT REQUEST</text><rect x="72" y="205" width="80" height="80" rx="14" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.5"/><text x="112" y="257" text-anchor="middle" style="font:700 34px Segoe UI, Arial; fill:#2563eb;">{ }</text><text x="172" y="236" text-anchor="start" class="body">Any compatible model input</text><text x="172" y="264" text-anchor="start" class="body">• feature schema</text><text x="172" y="292" text-anchor="start" class="body">• JSON or platform envelope</text><text x="172" y="320" text-anchor="start" class="body">• batch or single record</text><text x="194" y="370" class="small">Examples: Benefits • Model A • Model B</text><rect x="370" y="160" width="470" height="255" rx="24" fill="#ffffff" stroke="#22c55e" stroke-width="2.5"/><rect x="394" y="146" width="422" height="40" rx="20.0" fill="#16a34a"/><text x="605.0" y="172.0" text-anchor="middle" class="sectionTitle">SHARED MODEL PACKAGE</text><text x="605" y="198" text-anchor="middle" class="subtitle" style="font-size:17px;">Same artifact pattern reused across any of 3 models</text><rect x="410" y="232" width="105" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="438" y="250" width="50" height="32" rx="8" fill="#16a34a"/><text x="463" y="272" text-anchor="middle" style="font:700 18px Segoe UI, Arial; fill:white;">PKL</text><text x="462" y="310" text-anchor="middle" class="panelTitle" style="font-size:15px;">model.pkl</text><text x="462" y="330" text-anchor="middle" class="tiny">trained estimator</text><rect x="545" y="232" width="105" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="573" y="250" width="50" height="32" rx="8" fill="#2563eb"/><text x="598" y="272" text-anchor="middle" style="font:700 18px Segoe UI, Arial; fill:white;">JOBLIB</text><text x="597" y="310" text-anchor="middle" class="panelTitle" style="font-size:15px;">preprocessor.joblib</text><text x="597" y="330" text-anchor="middle" class="tiny">transformers / encoders</text><rect x="700" y="232" width="105" height="110" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><rect x="728" y="250" width="50" height="32" rx="8" fill="#7c3aed"/><text x="753" y="272" text-anchor="middle" style="font:700 18px Segoe UI, Arial; fill:white;">JSON</text><text x="752" y="310" text-anchor="middle" class="panelTitle" style="font-size:15px;">label_map.json</text><text x="752" y="330" text-anchor="middle" class="tiny">class / label mapping</text><rect x="405" y="352" width="400" height="44" rx="12" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/><text x="605" y="380" text-anchor="middle" class="chip">Feature schema shared across deployments • platform wrapper changes, not model logic</text><rect x="865" y="160" width="360" height="245" rx="24" fill="#ffffff" stroke="#7c3aed" stroke-width="2.5"/><rect x="889" y="146" width="312" height="40" rx="20.0" fill="#6d28d9"/><text x="1045.0" y="172.0" text-anchor="middle" class="sectionTitle">MODEL INFERENCE (Common Logic)</text><rect x="892" y="208" width="306" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/><text x="910" y="231" class="panelTitle" style="font-size:14px;">1) Load Artifacts</text><text x="1058" y="231" text-anchor="middle" class="small" style="font-size:13px;">load model, preprocessor, label map</text><rect x="892" y="253" width="306" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/><text x="910" y="276" class="panelTitle" style="font-size:14px;">2) Preprocess</text><text x="1058" y="276" text-anchor="middle" class="small" style="font-size:13px;">transform and validate input features</text><rect x="892" y="298" width="306" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/><text x="910" y="321" class="panelTitle" style="font-size:14px;">3) Predict</text><text x="1058" y="321" text-anchor="middle" class="small" style="font-size:13px;">generate class predictions &amp; probabilities</text><rect x="892" y="343" width="306" height="36" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2"/><text x="910" y="366" class="panelTitle" style="font-size:14px;">4) Postprocess</text><text x="1058" y="366" text-anchor="middle" class="small" style="font-size:13px;">map labels and format platform response</text><rect x="1255" y="160" width="280" height="250" rx="24" fill="#ffffff" stroke="#f97316" stroke-width="2.5"/><rect x="1279" y="146" width="232" height="40" rx="20.0" fill="#ea580c"/><text x="1395.0" y="172.0" text-anchor="middle" class="sectionTitle">OUTPUT RESPONSE</text><rect x="1283" y="210" width="92" height="72" rx="12" fill="#ffedd5" stroke="#fdba74" stroke-width="1.5"/><text x="1329" y="255" text-anchor="middle" style="font:700 30px Segoe UI, Arial; fill:#9a3412;">[⋯]</text><text x="1410" y="238" text-anchor="start" class="body">Prediction result</text><text x="1410" y="265" text-anchor="start" class="body">• labels</text><text x="1410" y="292" text-anchor="start" class="body">• probabilities</text><text x="1410" y="319" text-anchor="start" class="body">• platform-specific envelope</text><rect x="1278" y="305" width="228" height="74" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="1295" y="332" text-anchor="start" class="mono">{</text><text x="1295" y="346" text-anchor="start" class="mono">  "model": "Benefits",</text><text x="1295" y="360" text-anchor="start" class="mono">  "predictions": [...],</text><text x="1295" y="374" text-anchor="start" class="mono">  "probabilities": [...]</text><text x="1295" y="388" text-anchor="start" class="mono">}</text><line x1="344" y1="285" x2="370" y2="285" stroke="#2563eb" stroke-width="6" marker-end="url(#arrowBlue)" stroke-linecap="round"/><line x1="840" y1="285" x2="865" y2="285" stroke="#16a34a" stroke-width="6" marker-end="url(#arrowGreen)" stroke-linecap="round"/><line x1="1225" y1="285" x2="1255" y2="285" stroke="#2563eb" stroke-width="6" marker-end="url(#arrowBlue)" stroke-linecap="round"/><line x1="120" y1="450" x2="1480" y2="450" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/><rect x="30" y="468" width="365" height="360" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text x="56" y="508" class="panelTitle" style="font-size:20px; fill:#0f172a;">AWS SageMaker</text><text x="56" y="534" class="panelSub">Managed ML endpoints</text><rect x="48" y="554" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="64" y="573" class="chip" style="font-size:14px; fill:#1d4ed8;">ENTRY POINT</text><rect x="48" y="664" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="64" y="683" class="chip" style="font-size:14px; fill:#1d4ed8;">DEPLOYMENT</text><rect x="48" y="774" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="64" y="793" class="chip" style="font-size:14px; fill:#1d4ed8;">MONITORING</text><rect x="413" y="468" width="365" height="360" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/><text x="439" y="508" class="panelTitle" style="font-size:20px; fill:#0f172a;">Google Vertex AI</text><text x="439" y="534" class="panelSub">Custom Prediction Routine (CPR)</text><rect x="431" y="554" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="447" y="573" class="chip" style="font-size:14px; fill:#15803d;">ENTRY POINT</text><rect x="431" y="664" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="447" y="683" class="chip" style="font-size:14px; fill:#15803d;">DEPLOYMENT</text><rect x="431" y="774" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="447" y="793" class="chip" style="font-size:14px; fill:#15803d;">MONITORING</text><rect x="796" y="468" width="365" height="360" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/><text x="822" y="508" class="panelTitle" style="font-size:20px; fill:#0f172a;">IBM Watson Machine Learning</text><text x="822" y="534" class="panelSub">Enterprise ML with governance</text><rect x="814" y="554" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="830" y="573" class="chip" style="font-size:14px; fill:#6d28d9;">ENTRY POINT</text><rect x="814" y="664" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="830" y="683" class="chip" style="font-size:14px; fill:#6d28d9;">DEPLOYMENT</text><rect x="814" y="774" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="830" y="793" class="chip" style="font-size:14px; fill:#6d28d9;">MONITORING</text><rect x="1179" y="468" width="365" height="360" rx="24" fill="#ffedd5" stroke="#f59e0b" stroke-width="2.5"/><text x="1205" y="508" class="panelTitle" style="font-size:20px; fill:#0f172a;">Microsoft Azure ML</text><text x="1205" y="534" class="panelSub">Managed online endpoints</text><rect x="1197" y="554" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="1213" y="573" class="chip" style="font-size:14px; fill:#ea580c;">ENTRY POINT</text><rect x="1197" y="664" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="1213" y="683" class="chip" style="font-size:14px; fill:#ea580c;">DEPLOYMENT</text><rect x="1197" y="774" width="329" height="28" rx="10" fill="white" opacity="0.65"/><text x="1213" y="793" class="chip" style="font-size:14px; fill:#ea580c;">MONITORING</text><rect x="48" y="590" width="329" height="34" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="66" y="612" class="mono">model_fn(model_dir)</text><rect x="48" y="632" width="329" height="34" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="66" y="654" class="mono">input_fn(request_body, content_type)</text><rect x="48" y="674" width="329" height="34" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="66" y="696" class="mono">predict_fn(input_data, model_artifacts)</text><rect x="48" y="716" width="329" height="34" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="66" y="738" class="mono">output_fn(prediction, accept)</text><text x="64" y="703" text-anchor="start" class="small">• package model as model.tar.gz</text><text x="64" y="721" text-anchor="start" class="small">• upload to S3</text><text x="64" y="739" text-anchor="start" class="small">• create SageMaker endpoint</text><text x="64" y="813" text-anchor="start" class="small">Amazon SageMaker Clarify</text><text x="64" y="831" text-anchor="start" class="small">bias detection &amp; data quality</text><rect x="431" y="590" width="329" height="34" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/><text x="449" y="612" class="mono">load(artifacts_uri)</text><rect x="431" y="632" width="329" height="34" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/><text x="449" y="654" class="mono">preprocess(prediction_input)</text><rect x="431" y="674" width="329" height="34" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/><text x="449" y="696" class="mono">predict(instances)</text><rect x="431" y="716" width="329" height="34" rx="10" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/><text x="449" y="738" class="mono">postprocess(prediction_results)</text><text x="447" y="703" text-anchor="start" class="small">• store artifacts in GCS</text><text x="447" y="721" text-anchor="start" class="small">• build / deploy container</text><text x="447" y="739" text-anchor="start" class="small">• create Vertex AI endpoint</text><text x="447" y="813" text-anchor="start" class="small">Vertex AI Model Monitoring</text><text x="447" y="831" text-anchor="start" class="small">drift, skew &amp; performance</text><rect x="814" y="590" width="329" height="62" rx="10" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.2"/><text x="832" y="615" class="mono">score(payload)</text><text x="832" y="636" text-anchor="start" class="tiny">columnar fields / values format</text><rect x="814" y="660" width="329" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/><text x="832" y="684" text-anchor="start" class="mono">{ "input_data": [{</text><text x="832" y="698" text-anchor="start" class="mono">  "fields": [...],</text><text x="832" y="712" text-anchor="start" class="mono">  "values": [[...]]</text><text x="832" y="726" text-anchor="start" class="mono">}]}</text><text x="830" y="754" text-anchor="start" class="small">• archive model as .tar.gz</text><text x="830" y="772" text-anchor="start" class="small">• upload to Cloud Object Storage</text><text x="830" y="790" text-anchor="start" class="small">• deploy via Watson ML API</text><text x="830" y="813" text-anchor="start" class="small">Watson OpenScale</text><text x="830" y="831" text-anchor="start" class="small">fairness, explainability &amp; drift</text><rect x="1197" y="590" width="329" height="38" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="1215" y="614" class="mono">init()</text><rect x="1197" y="638" width="329" height="38" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="1215" y="662" class="mono">run(raw_data)</text><rect x="1197" y="682" width="329" height="58" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/><text x="1215" y="705" text-anchor="start" class="mono">{ "data": [...] }  or  [ {...} ]</text><text x="1213" y="754" text-anchor="start" class="small">• register model in Azure ML</text><text x="1213" y="772" text-anchor="start" class="small">• create managed online endpoint</text><text x="1213" y="790" text-anchor="start" class="small">• deploy with custom environment</text><text x="1213" y="813" text-anchor="start" class="small">Azure Responsible AI</text><text x="1213" y="831" text-anchor="start" class="small">fairness &amp; error analysis</text><line x1="212.5" y1="450" x2="212.5" y2="468" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/><line x1="595.5" y1="450" x2="595.5" y2="468" stroke="#16a34a" stroke-width="4" marker-end="url(#arrowGreen)"/><line x1="978.5" y1="450" x2="978.5" y2="468" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrowPurple)"/><line x1="1361.5" y1="450" x2="1361.5" y2="468" stroke="#f59e0b" stroke-width="4" marker-end="url(#arrowBlue)"/><rect x="295" y="848" width="1010" height="78" rx="16" fill="#dbeafe" stroke="#3b82f6" stroke-width="2.2"/><text x="800" y="880" text-anchor="middle" class="panelTitle" style="font-size:28px; fill:#1e3a8a;">CONSISTENT RESULTS ACROSS ALL PLATFORMS</text><text x="800" y="906" text-anchor="middle" class="small">Same reusable model package • Same feature schema • Equivalent predictions • Platform-specific wrappers only</text></svg>